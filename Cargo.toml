[package]
name = "memory-server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
fastembed = "7.0.1"
md-5 = "0.10"
neo4rs = "0.8"
qdrant-client = "1.19"
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "3.4.0", features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
portpicker = "0.1"
